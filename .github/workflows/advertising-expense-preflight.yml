name: Advertising expense patch
on:
  pull_request:
    paths:
      - 'scripts/enable_advertising_expenses.cjs'
      - '.github/workflows/advertising-expense-preflight.yml'
jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/advertising-expense-category'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/enable_advertising_expenses.cjs
      - run: node scripts/enable_advertising_expenses.cjs --check
      - run: node scripts/enable_advertising_expenses.cjs
      - run: npm ci --prefix functions-gmail --no-audit --no-fund
      - run: node --test functions-gmail/tests/*.test.cjs
      - run: node --experimental-default-type=module --check js/app.js
      - run: node --experimental-default-type=module --check js/services/sessionService.js
      - run: node --experimental-default-type=module --check js/expenseManagementOverview.js
      - run: git diff --check
      - name: Commit only vetted source changes to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions-gmail/candidateReview.js functions-gmail/evidenceReview.js functions-gmail/expensePosting.js functions-gmail/tests/evidenceReview.test.cjs functions-gmail/tests/expensePosting.test.cjs js/services/sessionService.js js/app.js js/expenseManagementOverview.js gmail-expense-review.html index.html sw.js
          git diff --cached --quiet && exit 1
          git commit -m 'Add advertising expense category and JPY support for overseas events'
          git push origin HEAD:refs/heads/feature/advertising-expense-category
