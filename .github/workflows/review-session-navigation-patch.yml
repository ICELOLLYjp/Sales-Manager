name: Review session navigation patch
on:
  pull_request:
    paths:
      - 'scripts/add_review_session_navigation.cjs'
      - '.github/workflows/review-session-navigation-patch.yml'
jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/review-to-session-navigation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/add_review_session_navigation.cjs
      - run: node scripts/add_review_session_navigation.cjs --check
      - run: node scripts/add_review_session_navigation.cjs
      - run: git diff --check
      - name: Verify navigation scope
        run: |
          git diff --exit-code -- . ':!gmail-expense-review.html'
          grep -q 'import { sessionExpenseDetailHref }' gmail-expense-review.html
          grep -q 'addSessionDetailLink(form, item)' gmail-expense-review.html
          grep -q 'link.target = "_blank"' gmail-expense-review.html
          grep -q 'link.rel = "noopener noreferrer"' gmail-expense-review.html
      - name: Commit only reviewed navigation change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gmail-expense-review.html
          git diff --cached --quiet && exit 1
          git commit -m 'Link reviewed Gmail expenses to session sales details'
          git push origin HEAD:refs/heads/fix/review-to-session-navigation
