name: Fast POS navigation and exit
on:
  pull_request:
    paths:
      - 'js/fastPosUi.js'
      - 'js/fastPosModeEnhancement.js'
      - 'js/fastPosSessionEnhancement.js'
      - 'js/historyNavigationReliability.js'
      - 'tests/fastPosOverlayExit.test.mjs'
      - '.github/workflows/fast-pos-overlay-exit-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --check js/fastPosUi.js
      - run: node --experimental-default-type=module --check js/fastPosModeEnhancement.js
      - run: node --experimental-default-type=module --check js/fastPosSessionEnhancement.js
      - run: node --experimental-default-type=module --check js/historyNavigationReliability.js
      - run: node --test tests/fastPosOverlayExit.test.mjs
