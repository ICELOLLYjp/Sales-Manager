name: Apply home icons v3

on:
  push:
    branches:
      - feat/home-icons-v3-20261005
    paths:
      - .github/workflows/apply-home-icons-v3.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-icons-v3-20261005
          fetch-depth: 0
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Render icons and patch HTML
        run: |
          rsvg-convert -w 180 -h 180 icons/home-sales-v3.svg > sales-touch-icon-v3.png
          rsvg-convert -w 180 -h 180 icons/home-expense-v3.svg > expense-touch-icon-v3.png
          python3 - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace('<link rel="icon" type="image/svg+xml" href="./app-icon.svg">', '<link rel="icon" type="image/png" href="./sales-touch-icon-v3.png">')
          s = s.replace('<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">', '<link rel="apple-touch-icon" sizes="180x180" href="./sales-touch-icon-v3.png">')
          p.write_text(s, encoding="utf-8")

          p = Path("expense-management.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace('<link rel="icon" type="image/svg+xml" href="./expense-icon.svg">', '<link rel="icon" type="image/png" href="./expense-touch-icon-v3.png">')
          s = s.replace('<link rel="apple-touch-icon" sizes="180x180" href="./expense-touch-icon.png">', '<link rel="apple-touch-icon" sizes="180x180" href="./expense-touch-icon-v3.png">')
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-home-icons-v3.yml
          git add index.html expense-management.html sales-touch-icon-v3.png expense-touch-icon-v3.png
          git commit -m "Apply v3 home screen icons"
          git push origin HEAD:feat/home-icons-v3-20261005
