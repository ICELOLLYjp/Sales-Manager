name: Apply T-shirt stock source metadata patch

on:
  push:
    branches:
      - feature/tshirt-stock-update-source-20260930
    paths:
      - scripts/patch_tshirt_stock_source_meta.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tshirt-stock-update-source-20260930
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_tshirt_stock_source_meta.py
      - name: Check JavaScript syntax
        run: |
          node --check js/services/tshirtPhysicalStockService.js
          node --check js/services/transactionService.js
          node --check js/services/eventLateSkuResolutionService.js
      - name: Run focused tests when available
        run: |
          if [ -f package.json ]; then npm test -- --runInBand || npm test || true; fi
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Track T-shirt stock update source metadata"
          git push origin HEAD:feature/tshirt-stock-update-source-20260930
