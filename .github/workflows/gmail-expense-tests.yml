name: Gmail expense foundations
on:
  pull_request:
    paths:
      - 'functions-gmail/**'
      - 'js/services/gmailExpenseCandidateService.js'
      - 'tests/gmailExpenseCandidateService.test.mjs'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/gmail-expense-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix functions-gmail --no-audit --no-fund
      - run: node --check functions-gmail/index.js
      - run: node --check functions-gmail/oauthCore.js
      - run: node --check functions-gmail/expensePreview.js
      - run: node --check functions-gmail/candidateStorage.js
      - run: node --test functions-gmail/tests/*.test.cjs
      - run: node --experimental-default-type=module tests/gmailExpenseCandidateService.test.mjs
