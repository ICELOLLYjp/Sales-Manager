name: Gmail expense foundations
on:
  pull_request:
    paths:
      - 'functions-gmail/**'
      - 'js/services/gmailExpenseCandidateService.js'
      - 'js/expenseOverviewModel.js'
      - 'js/expenseEventOverviewModel.js'
      - 'js/expenseManagementOverview.js'
      - 'js/expenseSourceNavigationModel.js'
      - 'js/sessionExpenseDeepLink.js'
      - 'js/gmailExpenseBulkModel.js'
      - 'js/gmailExpenseBulkReview.js'
      - 'js/gmailExpenseIntakeModel.js'
      - 'js/gmailExpenseIntake.js'
      - 'js/gmailExpenseInlineReview.js'
      - 'js/expenseManagementNavigation.js'
      - 'gmail-expense-intake.html'
      - 'tests/gmailExpenseIntakeModel.test.mjs'
      - 'tests/gmailExpenseMonthSelect.test.mjs'
      - 'tests/gmailExpenseInlineReview.test.mjs'
      - 'gmail-expense-bulk.html'
      - 'index.html'
      - 'expense-management.html'
      - 'tests/gmailExpenseCandidateService.test.mjs'
      - 'tests/expenseOverviewModel.test.mjs'
      - 'tests/expenseEventOverviewModel.test.mjs'
      - 'tests/expenseSourceNavigationModel.test.mjs'
      - 'tests/gmailExpenseBulkModel.test.mjs'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/gmail-expense-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix functions-gmail --no-audit --no-fund
      - run: node --check functions-gmail/index.js
      - run: node --check functions-gmail/oauthCore.js
      - run: node --check functions-gmail/expensePreview.js
      - run: node --check functions-gmail/candidateStorage.js
      - run: node --check functions-gmail/candidateReview.js
      - run: node --check functions-gmail/evidenceInspection.js
      - run: node --check functions-gmail/evidenceReview.js
      - run: node --test functions-gmail/tests/*.test.cjs
      - run: node --experimental-default-type=module tests/gmailExpenseCandidateService.test.mjs
      - run: node --experimental-default-type=module --check js/expenseOverviewModel.js
      - run: node --experimental-default-type=module --check js/expenseEventOverviewModel.js
      - run: node --experimental-default-type=module --check js/expenseSourceNavigationModel.js
      - run: node --experimental-default-type=module --check js/sessionExpenseDeepLink.js
      - run: node --experimental-default-type=module --check js/expenseManagementOverview.js
      - run: node --experimental-default-type=module --check js/gmailExpenseBulkModel.js
      - run: node --experimental-default-type=module --check js/gmailExpenseBulkReview.js
      - run: node --experimental-default-type=module --check js/gmailExpenseIntakeModel.js
      - run: node --experimental-default-type=module --check js/gmailExpenseIntake.js
      - run: node --experimental-default-type=module --check js/gmailExpenseInlineReview.js
      - run: node --experimental-default-type=module --check js/expenseManagementNavigation.js
      - run: node --experimental-default-type=module --test tests/expenseOverviewModel.test.mjs
      - run: node --experimental-default-type=module --test tests/expenseEventOverviewModel.test.mjs
      - run: node --experimental-default-type=module --test tests/expenseSourceNavigationModel.test.mjs
      - run: node --experimental-default-type=module --test tests/gmailExpenseBulkModel.test.mjs
      - run: node --experimental-default-type=module --test tests/gmailExpenseIntakeModel.test.mjs
      - run: node --test tests/gmailExpenseMonthSelect.test.mjs
      - run: node --experimental-default-type=module --test tests/gmailExpenseInlineReview.test.mjs
