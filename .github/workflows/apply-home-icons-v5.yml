name: Apply matte home icons v5

on:
  push:
    branches:
      - style/home-icons-v5-matte
    paths:
      - .github/workflows/apply-home-icons-v5.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/home-icons-v5-matte
          fetch-depth: 0
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Render icons and patch HTML
        run: |
          rsvg-convert -w 180 -h 180 icons/home-sales-v5.svg > sales-touch-icon-v5.png
          rsvg-convert -w 180 -h 180 icons/home-expense-v5.svg > expense-touch-icon-v5.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace('./sales-touch-icon-v4.png','./sales-touch-icon-v5.png')
          p.write_text(s,encoding="utf-8")
          p=Path("expense-management.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace('./expense-touch-icon-v4.png','./expense-touch-icon-v5.png')
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-home-icons-v5.yml
          git add index.html expense-management.html sales-touch-icon-v5.png expense-touch-icon-v5.png
          git commit -m "Apply matte v5 home screen icons"
          git push origin HEAD:style/home-icons-v5-matte
