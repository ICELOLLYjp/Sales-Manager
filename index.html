<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>ICELOLLY Sales Manager</title>
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="brand">ICELOLLY</div>
        <div class="subbrand">Sales Manager</div>
      </div>
      <div id="syncStatus" class="sync-status">Local</div>
    </header>

    <main id="view" class="view"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-route="dashboard" class="nav-btn active">Dashboard</button>
      <button data-route="sessions" class="nav-btn">Sessions</button>
      <button data-route="pos" class="nav-btn nav-btn-primary">POS</button>
      <button data-route="inventory" class="nav-btn">Inventory</button>
      <button data-route="more" class="nav-btn">More</button>
    </nav>
  </div>


  <script>
    (function () {
      function showBootError(message) {
        var status = document.getElementById("syncStatus");
        var view = document.getElementById("view");

        if (status) {
          status.textContent = "Error";
        }

        if (
          view &&
          !view.dataset.booted
        ) {
          view.innerHTML =
            '<div class="warning" style="margin:20px;">'
            + 'アプリの読み込みに失敗しました。<br>'
            + String(message || "Unknown error")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
            + '</div>';
        }
      }

      window.addEventListener(
        "error",
        function (event) {
          showBootError(
            event.message ||
            event.error?.message ||
            "JavaScript読み込みエラー"
          );
        }
      );

      window.addEventListener(
        "unhandledrejection",
        function (event) {
          showBootError(
            event.reason?.message ||
            event.reason ||
            "JavaScript処理エラー"
          );
        }
      );
    })();
  </script>

  <script type="module" src="./js/app.js?v=20260910-event-carry-stock-ui-1"></script>
</body>
</html>
