<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">

  <title>ICELOLLY Sales Manager</title>

  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>

  <div id="app">

    <header class="topbar">

      <div>
        <div class="brand">ICELOLLY</div>
        <div class="subbrand">Sales Manager</div>
      </div>

      <div id="syncStatus" class="sync-status">
        Connecting
      </div>

    </header>


    <main id="view" class="view"></main>


    <nav class="bottom-nav" aria-label="Main navigation">

      <button
        data-route="dashboard"
        class="nav-btn active"
        type="button">
        Dashboard
      </button>

      <button
        data-route="sessions"
        class="nav-btn"
        type="button">
        Sessions
      </button>

      <button
        data-route="pos"
        class="nav-btn nav-btn-primary"
        type="button">
        POS
      </button>

      <button
        data-route="inventory"
        class="nav-btn"
        type="button">
        Inventory
      </button>

      <button
        data-route="more"
        class="nav-btn"
        type="button">
        More
      </button>

    </nav>

  </div>

  <script type="module" src="./js/app.js"></script>

</body>
</html>
