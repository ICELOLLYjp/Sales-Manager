    (function(){
      function enhanceInput(input){if(!input||input.dataset.iphoneStepperReady==="1")return;if(input.closest(".inventoryClosingStepper, .eventCarryStepper, .iphoneQtyFallbackStepper"))return;var wrapper=document.createElement("div");wrapper.className="iphoneQtyFallbackStepper";var minus=document.createElement("button");minus.type="button";minus.className="iphoneQtyFallbackButton";minus.textContent="−";minus.setAttribute("aria-label","数量を1減らす");var plus=document.createElement("button");plus.type="button";plus.className="iphoneQtyFallbackButton";plus.textContent="＋";plus.setAttribute("aria-label","数量を1増やす");input.parentNode.insertBefore(wrapper,input);wrapper.appendChild(minus);wrapper.appendChild(input);wrapper.appendChild(plus);input.dataset.iphoneStepperReady="1";function change(delta){var current=input.value===""?0:Number(input.value);if(!Number.isFinite(current))current=0;var next=Math.max(0,Math.floor(current)+delta);input.value=String(next);input.dispatchEvent(new Event("input",{bubbles:true}));input.dispatchEvent(new Event("change",{bubbles:true}));if(navigator.vibrate)navigator.vibrate(8)}minus.addEventListener("click",function(){change(-1)});plus.addEventListener("click",function(){change(1)})}
      function enhanceVisibleCountInputs(){document.querySelectorAll(".inventoryClosingQty, .eventCarryQtyInput").forEach(enhanceInput)}
      enhanceVisibleCountInputs();new MutationObserver(enhanceVisibleCountInputs).observe(document.body,{childList:true,subtree:true});document.addEventListener("visibilitychange",function(){if(!document.hidden)enhanceVisibleCountInputs()})
    })();
  </script>
<script>
(function () {
  const selectors = ".eventCarryQtyInput, .inventoryClosingQty, .if-physical";
  const rows = "tr, .color-row, .mrow, .item";
  function visible(node) {
    return !node.disabled && node.getClientRects().length > 0;
  }
  document.addEventListener("focusin", event => {
    const input = event.target;
    if (input.matches?.(selectors) && typeof input.select === "function") input.select();
  });
  document.addEventListener("keydown", event => {
    const input = event.target;
    if (!input.matches?.(selectors) || event.isComposing || event.ctrlKey || event.altKey || event.metaKey) return;
    const key = event.key;
    if (!["Tab", "Enter", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(key)) return;
    const selector = selectors.split(",").find(part => input.matches(part.trim()))?.trim();
    const scope = input.closest(".if-card, .inventory-review, #matrix, #list, #view, #app") || document;
    const all = [...scope.querySelectorAll(selector)].filter(visible);
    const index = all.indexOf(input);
    if (index < 0) return;
    const direction = key === "ArrowLeft" || key === "ArrowUp" || (key === "Tab" && event.shiftKey) ? -1 : 1;
    let next = null;
    if (key.startsWith("Arrow")) {
      const row = input.closest(rows);
      const peers = row ? [...row.querySelectorAll(selector)].filter(visible) : [];
      const column = peers.indexOf(input);
      if (column >= 0 && (key === "ArrowLeft" || key === "ArrowRight")) {
        next = peers[column + direction] || null;
      } else if (column >= 0) {
        let neighbor = direction < 0 ? row.previousElementSibling : row.nextElementSibling;
        while (neighbor && !next) {
          const candidates = [...neighbor.querySelectorAll(selector)].filter(visible);
          next = candidates[column] || null;
          neighbor = direction < 0 ? neighbor.previousElementSibling : neighbor.nextElementSibling;
        }
      }
    }
    next ||= all[index + direction] || null;
    if (!next) return;
    event.preventDefault();
    event.stopPropagation();
    next.focus();
    next.select();
    next.scrollIntoView?.({ block: "nearest", inline: "nearest" });
  }, true);
})();
</script>
