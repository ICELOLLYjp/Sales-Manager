<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>保存済みGmail経費候補 | ICELOLLY Sales Manager</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#203043;background:#f6f8fb}body{margin:0}main{max-width:860px;margin:auto;padding:22px 16px 56px}a{color:#225b96}h1{font-size:1.65rem;margin:20px 0 8px}h2{font-size:1.2rem}p{line-height:1.65}.muted{color:#526274;font-size:.94rem}.card{background:#fff;border:1px solid #dce3eb;border-radius:14px;padding:18px;margin:16px 0}.item{border-top:1px solid #e5ebf1;padding:16px 0;overflow-wrap:anywhere}.item:first-child{border-top:0}.item strong{display:block;margin:5px 0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.classification{display:grid;gap:5px;margin-top:10px;max-width:100%}button,input,select{font:inherit}button{padding:10px 14px;min-height:44px;border:1px solid #245783;border-radius:10px;background:#245b90;color:#fff;font-weight:650}button.secondary{background:#fff;color:#245783}button.exclude{background:#fff;color:#9a2430;border-color:#9a2430}button.post{background:#17643a;border-color:#17643a}button:disabled{opacity:.5}input,select{padding:10px;border:1px solid #9eabba;border-radius:8px;background:#fff;max-width:100%}.tag{display:inline-block;padding:3px 8px;border-radius:8px;font-size:.83rem;margin:4px 6px 0 0}.unreviewed{background:#fff2d5;color:#705000}.kept{background:#e1f4e8;color:#17643a}.excluded{background:#f0f2f4;color:#526274}.duplicate{background:#ffe4e4;color:#8c1d28}.scope{background:#e8eff8;color:#244f78}.posted{background:#d9f0e2;color:#0d5630}.evidence{margin-top:12px;padding:12px;border:1px solid #dce3eb;border-radius:10px;background:#f8fafc}.evidence pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:.9rem;max-height:320px;overflow:auto}.evidence ul{padding-left:20px}.review-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.review-form label{display:grid;gap:5px}.review-form .wide{grid-column:1/-1}@media(max-width:600px){.review-form{grid-template-columns:1fr}}#notice{white-space:pre-wrap;overflow-wrap:anywhere}#notice[role=alert]{color:#a21f30}
  </style>
</head>
<body>
<main>
  <a href="./">← Sales Manager</a> · <a href="./gmail-expenses.html">Gmail候補の取得</a> · <a href="./gmail-connect.html">Gmail接続</a>
  <h1>保存済みGmail経費候補</h1>
  <p class="muted">保存済み候補を人が確認し、支払証拠、金額、通貨、分類を下書き保存します。条件が揃った候補だけ、別の確認操作で1件ずつ経費台帳へ登録できます。</p>
  <section class="card">
    <h2>表示条件</h2>
    <p id="staff">ログイン状態を確認しています…</p>
    <button id="login" class="secondary" type="button" hidden>Sales Managerにログイン</button>
    <label for="month">対象月</label>
    <input type="month" id="month" value="2026-09" min="2025-01" max="2030-12">
    <button id="load" type="button" disabled>保存済み候補を表示</button>
    <div id="filterArea" hidden>
      <label for="eventFilter">イベントで絞り込み</label>
      <select id="eventFilter"><option value="all">すべてのイベントと未分類</option></select>
    </div>
    <p id="notice" aria-live="polite"></p>
  </section>
  <section class="card">
    <h2>候補一覧</h2>
    <div id="summary" class="muted">まだ読み込んでいません。</div>
    <div id="results" aria-live="polite"></div>
  </section>
</main>
<script type="module">
  import { initFirebase, getFirebaseState } from "./js/firebase.js";
  import { initAuth, loginWithGoogle } from "./js/auth.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-functions.js";

  const staff = document.getElementById("staff"), login = document.getElementById("login");
  const month = document.getElementById("month"), load = document.getElementById("load");
  const filterArea = document.getElementById("filterArea"), eventFilter = document.getElementById("eventFilter");
  const notice = document.getElementById("notice"), summary = document.getElementById("summary"), results = document.getElementById("results");
  let signedIn = false, busy = false, functions = null, state = null;
  const evidenceById = new Map();

  function message(value, error = false) {
    notice.textContent = value;
    if(error) notice.setAttribute("role", "alert"); else notice.removeAttribute("role");
  }
  function update() {
    login.disabled = busy;
    month.disabled = busy;
    load.disabled = busy || !signedIn;
    eventFilter.disabled = busy || !state;
    for(const control of results.querySelectorAll("button[data-status], button[data-evidence], button[data-save-evidence], button[data-post-expense], select[data-scope], .review-form input, .review-form select")) {
      const article = control.closest(".item");
      const posted = article?.dataset.posted === "true";
      if(control.matches("button[data-status]")) control.disabled = busy || posted || control.dataset.status === article?.dataset.status;
      else if(control.matches("select[data-scope], button[data-save-evidence], .review-form input, .review-form select")) control.disabled = busy || posted;
      else control.disabled = busy;
    }
  }
  async function callable(name, data = {}) {
    if(!functions || !signedIn) throw new Error("Sales Managerにログインしてください。");
    const response = await httpsCallable(functions, name)(data);
    return response.data;
  }
  function statusLabel(status) {
    return status === "kept" ? "候補に残す" : status === "excluded" ? "除外" : "未確認";
  }
  function scopeValue(item) {
    return item.expenseScope === "event" && item.eventId ? `event:${item.eventId}` : item.expenseScope || "unassigned";
  }
  function sessionLabel(item) {
    const place = [item.city, item.country].filter(Boolean).join(", ");
    const date = [item.startDate, item.endDate && item.endDate !== item.startDate ? item.endDate : ""].filter(Boolean).join("〜");
    return [item.eventName, place, date].filter(Boolean).join(" ／ ");
  }
  const categoryLabels = { boothFee: "出店料", flight: "航空券", hotel: "宿泊", shipping: "発送", transport: "現地交通", interpreter: "通訳", other: "その他" };
  function postingSession(item) {
    return item.expenseScope === "event" && item.eventId ? (state?.sessions || []).find(session => session.id === item.eventId) : null;
  }
  function canPost(item) {
    const review = item.evidenceReview;
    return state?.expensePostingAvailable === true && item.reviewStatus === "kept" && !item.expensePosted && Boolean(postingSession(item)) && review?.paymentStatus === "paid_evidence" && Number(review.amount) > 0 && Boolean(review.currency) && Boolean(categoryLabels[review.category]);
  }
  function populateFilter() {
    const selected = eventFilter.value || "all";
    eventFilter.replaceChildren(new Option("すべてのイベントと未分類", "all"), new Option("未分類", "unassigned"), new Option("イベント共通／一般経費", "general"));
    for(const session of state?.sessions || []) eventFilter.add(new Option(sessionLabel(session), `event:${session.id}`));
    eventFilter.value = [...eventFilter.options].some(option => option.value === selected) ? selected : "all";
    filterArea.hidden = false;
  }
  function visibleCandidates() {
    const filter = eventFilter.value || "all";
    if(filter === "all") return state?.candidates || [];
    return (state?.candidates || []).filter(item => scopeValue(item) === filter);
  }
  function render() {
    results.replaceChildren();
    const candidates = visibleCandidates();
    const duplicateIds = new Set((state?.duplicateGroups || []).flat());
    const counts = { unreviewed: 0, kept: 0, excluded: 0 };
    for(const item of candidates) counts[item.reviewStatus] = (counts[item.reviewStatus] || 0) + 1;
    summary.textContent = `${state?.month || month.value}：表示${candidates.length}件　未確認${counts.unreviewed}件　候補に残す${counts.kept}件　除外${counts.excluded}件${state?.truncated ? "　表示上限に達しています" : ""}`;
    if(!candidates.length) {
      const empty = document.createElement("p"); empty.textContent = "この条件の保存済み候補はありません。"; results.append(empty); return;
    }
    for(const item of candidates) {
      const article = document.createElement("article"); article.className = "item"; article.dataset.id = item.id; article.dataset.status = item.reviewStatus; article.dataset.posted = item.expensePosted ? "true" : "false";
      const title = document.createElement("strong"); title.textContent = item.subject || "（件名なし）";
      const meta = document.createElement("div"); meta.textContent = `${item.date || "日付不明"} · ${item.sender || "差出人不明"} · ${item.account}`;
      const status = document.createElement("span"); status.className = `tag ${item.reviewStatus}`; status.textContent = statusLabel(item.reviewStatus);
      const scopeTag = document.createElement("span"); scopeTag.className = "tag scope";
      scopeTag.textContent = item.expenseScope === "event" ? (item.eventName || "イベント") : item.expenseScope === "general" ? "イベント共通／一般経費" : "未分類";
      article.append(title, meta, status, scopeTag);
      if(item.evidenceReview) {
        const reviewed = document.createElement("span"); reviewed.className = "tag kept"; reviewed.textContent = "解析下書きあり"; article.append(reviewed);
      }
      if(item.expensePosted) {
        const posted = document.createElement("span"); posted.className = "tag posted"; posted.textContent = "経費登録済み"; article.append(posted);
      }
      if(duplicateIds.has(item.id)) {
        const duplicate = document.createElement("span"); duplicate.className = "tag duplicate"; duplicate.textContent = "重複の可能性あり"; article.append(duplicate);
      }
      const classification = document.createElement("label"); classification.className = "classification"; classification.textContent = "対象イベント";
      const select = document.createElement("select"); select.dataset.scope = "true";
      select.add(new Option("未分類", "unassigned"));
      select.add(new Option("イベント共通／一般経費", "general"));
      for(const session of state.sessions || []) select.add(new Option(sessionLabel(session), `event:${session.id}`));
      select.value = scopeValue(item); select.disabled = busy || item.expensePosted; classification.append(select); article.append(classification);
      const actions = document.createElement("div"); actions.className = "actions";
      for(const option of [["kept", "候補に残す", "secondary"], ["excluded", "除外", "exclude"], ["unreviewed", "未確認に戻す", "secondary"]]) {
        const button = document.createElement("button"); button.type = "button"; button.dataset.status = option[0];
        button.textContent = option[1]; button.className = option[2]; button.disabled = busy || item.expensePosted || item.reviewStatus === option[0]; actions.append(button);
      }
      article.append(actions);
      if(item.reviewStatus === "kept") {
        const inspect = document.createElement("button"); inspect.type = "button"; inspect.className = "secondary"; inspect.dataset.evidence = "true";
        inspect.textContent = evidenceById.has(item.id) ? "本文と添付を再確認" : "本文と添付を確認";
        actions.append(inspect);
      }
      if(canPost(item)) {
        const post = document.createElement("button"); post.type = "button"; post.className = "post"; post.dataset.postExpense = "true";
        post.textContent = "この1件を経費台帳へ登録"; actions.append(post);
      }
      const evidence = evidenceById.get(item.id);
      if(evidence && item.reviewStatus === "kept") {
        const panel = document.createElement("section"); panel.className = "evidence";
        const heading = document.createElement("strong"); heading.textContent = "メール本文と添付の一時確認";
        const note = document.createElement("p"); note.className = "muted"; note.textContent = "本文とPDF解析結果は候補レコードへ保存していません。金額候補は必ず人が確認してください。";
        panel.append(heading, note);
        if(evidence.excerpt) {
          const excerpt = document.createElement("pre"); excerpt.textContent = evidence.excerpt; panel.append(excerpt);
        } else {
          const empty = document.createElement("p"); empty.textContent = "読み取れる本文テキストはありませんでした。"; panel.append(empty);
        }
        if((evidence.moneyHints || []).length) {
          const hints = document.createElement("p"); hints.textContent = `金額表記の候補: ${evidence.moneyHints.join(" ／ ")}`; panel.append(hints);
        }
        const attachmentHeading = document.createElement("strong"); attachmentHeading.textContent = `添付ファイル ${(evidence.attachments || []).length}件`; panel.append(attachmentHeading);
        if((evidence.attachments || []).length) {
          const list = document.createElement("ul");
          for(const file of evidence.attachments) {
            const row = document.createElement("li");
            const size = typeof file.size === "number" ? ` ／ ${Math.ceil(file.size / 1024)} KB` : "";
            row.textContent = `${file.filename} ／ ${file.mimeType}${size}${file.isPdf ? " ／ PDF" : ""}`; list.append(row);
          }
          panel.append(list);
        }
        if((evidence.pdfResults || []).length) {
          const pdfHeading = document.createElement("strong"); pdfHeading.textContent = "PDF本文の一時解析"; panel.append(pdfHeading);
          const statusText = {
            parsed: "テキストを抽出しました",
            no_text: "抽出できるテキストがありません",
            too_large: "容量上限を超えたため解析していません",
            too_many_pages: "ページ数上限を超えたため解析していません",
            failed: "解析できませんでした"
          };
          for(const pdf of evidence.pdfResults) {
            const row = document.createElement("div"); row.className = "pdf-result";
            const label = document.createElement("p");
            label.textContent = `${pdf.filename}${pdf.pages ? ` ／ ${pdf.pages}ページ` : ""} ／ ${statusText[pdf.status] || "未解析"}`;
            row.append(label);
            if(pdf.excerpt) {
              const text = document.createElement("pre"); text.textContent = pdf.excerpt; row.append(text);
            }
            panel.append(row);
          }
        }
        const saved = item.evidenceReview || {};
        const form = document.createElement("div"); form.className = "review-form";
        const amountLabel = document.createElement("label"); amountLabel.textContent = "確認した金額";
        const amount = document.createElement("input"); amount.type = "number"; amount.min = "0"; amount.step = "0.01"; amount.dataset.field = "amount"; amount.value = saved.amount ?? ""; amountLabel.append(amount);
        const currencyLabel = document.createElement("label"); currencyLabel.textContent = "通貨";
        const currency = document.createElement("select"); currency.dataset.field = "currency"; currency.add(new Option("未確認", ""));
        for(const code of ["JPY","SGD","TWD","HKD","THB","USD"]) currency.add(new Option(code, code));
        currency.value = saved.currency || evidence.eventCurrency || ""; currencyLabel.append(currency);
        const paymentLabel = document.createElement("label"); paymentLabel.textContent = "証拠の状態";
        const payment = document.createElement("select"); payment.dataset.field = "paymentStatus";
        payment.add(new Option("未確認", "unverified")); payment.add(new Option("請求書のみ", "invoiced")); payment.add(new Option("支払確認あり", "paid_evidence"));
        payment.value = saved.paymentStatus || "unverified"; paymentLabel.append(payment);
        const categoryLabel = document.createElement("label"); categoryLabel.textContent = "経費分類";
        const category = document.createElement("select"); category.dataset.field = "category";
        for(const option of [["boothFee","出店料"],["flight","航空券"],["hotel","宿泊"],["shipping","発送"],["transport","現地交通"],["interpreter","通訳"],["other","その他"]]) category.add(new Option(option[1], option[0]));
        category.value = saved.category || "other"; categoryLabel.append(category);
        const descriptionLabel = document.createElement("label"); descriptionLabel.className = "wide"; descriptionLabel.textContent = "内容";
        const description = document.createElement("input"); description.type = "text"; description.maxLength = 500; description.dataset.field = "description";
        description.value = saved.description || item.subject || ""; descriptionLabel.append(description);
        const saveDraft = document.createElement("button"); saveDraft.type = "button"; saveDraft.dataset.saveEvidence = "true"; saveDraft.textContent = "解析結果を下書き保存"; saveDraft.disabled = busy || item.expensePosted;
        form.append(amountLabel, currencyLabel, paymentLabel, categoryLabel, descriptionLabel, saveDraft);
        panel.append(form);
        article.append(panel);
      }
      results.append(article);
    }
  }
  async function loadCandidates() {
    if(busy || !signedIn) return;
    const selectedMonth = month.value;
    if(!/^20\d{2}-(0[1-9]|1[0-2])$/.test(selectedMonth)) { message("対象月を選択してください。", true); return; }
    busy = true; update(); message("保存済み候補を読み込んでいます…");
    try {
      state = await callable("gmailExpenseCandidateList", { month: selectedMonth });
      populateFilter(); render();
      message("保存済み候補を表示しました。対象イベントはまだ経費台帳への登録ではありません。");
    } catch(e) { message(`候補を読み込めませんでした: ${e.message || e}`, true); }
    finally { busy = false; update(); }
  }
  async function review(candidateId, status) {
    if(busy || !state) return;
    busy = true; update(); message("確認状態を保存しています…");
    try {
      await callable("gmailExpenseCandidateReview", { candidateId, status });
      const item = state.candidates.find(row => row.id === candidateId);
      if(item) { item.reviewStatus = status; item.reviewRequired = status === "unreviewed"; }
      render(); message("確認状態を保存しました。経費台帳には登録していません。");
    } catch(e) { message(`確認状態を保存できませんでした: ${e.message || e}`, true); }
    finally { busy = false; update(); }
  }
  async function inspectEvidence(candidateId) {
    if(busy || !state) return;
    busy = true; update(); message("メール本文と添付情報を一時取得しています…");
    try {
      const data = await callable("gmailExpenseInspectEvidence", { candidateId });
      evidenceById.set(candidateId, data);
      render();
      message(`本文情報を一時表示しました。添付${(data.attachments || []).length}件、PDF${data.pdfCount || 0}件です。経費台帳には登録していません。`);
    } catch(e) { message(`本文と添付情報を取得できませんでした: ${e.message || e}`, true); }
    finally { busy = false; update(); }
  }
  async function saveEvidenceReview(candidateId, article) {
    if(busy || !state || !article) return;
    const field = name => article.querySelector(`[data-field="${name}"]`)?.value ?? "";
    const review = {
      amount: field("amount"),
      currency: field("currency"),
      paymentStatus: field("paymentStatus"),
      category: field("category"),
      description: field("description")
    };
    busy = true; update(); message("解析結果の下書きを保存しています…");
    try {
      const data = await callable("gmailExpenseSaveEvidenceReview", { candidateId, review });
      const item = state.candidates.find(row => row.id === candidateId);
      if(item) {
        item.evidenceReview = data.evidenceReview;
        item.amount = data.evidenceReview.amount;
        item.currency = data.evidenceReview.currency;
        item.paymentConfirmed = data.evidenceReview.paymentStatus === "paid_evidence";
      }
      render();
      message("解析結果を候補の下書きとして保存しました。経費台帳には登録していません。");
    } catch(e) { message(`解析結果を保存できませんでした: ${e.message || e}`, true); }
    finally { busy = false; update(); }
  }
  async function assignEvent(candidateId, value) {
    if(busy || !state) return;
    const expenseScope = value.startsWith("event:") ? "event" : value;
    const eventId = expenseScope === "event" ? value.slice(6) : null;
    busy = true; update(); message("対象イベントを保存しています…");
    try {
      const data = await callable("gmailExpenseCandidateAssignEvent", { candidateId, expenseScope, eventId });
      const item = state.candidates.find(row => row.id === candidateId);
      if(item) { item.expenseScope = data.expenseScope; item.eventId = data.eventId; item.eventName = data.eventName; }
      render(); message("対象イベントを保存しました。経費台帳には登録していません。");
    } catch(e) { message(`対象イベントを保存できませんでした: ${e.message || e}`, true); render(); }
    finally { busy = false; update(); }
  }
  async function postExpense(candidateId) {
    if(busy || !state) return;
    const item = state.candidates.find(row => row.id === candidateId);
    const session = item ? postingSession(item) : null;
    const review = item?.evidenceReview;
    if(!item || !session || !canPost(item)) { message("登録条件が揃っていません。候補を再読み込みしてください。", true); return; }
    const current = Number(session.expenses?.[review.category]?.amount || 0);
    const amount = Number(review.amount);
    const next = current + amount;
    const label = categoryLabels[review.category] || review.category;
    const confirmed = window.confirm([
      "次の1件だけを経費台帳へ登録します。",
      "",
      `イベント: ${sessionLabel(session)}`,
      `分類: ${label}`,
      `今回: ${amount.toLocaleString("ja-JP")} ${review.currency}`,
      `現在: ${current.toLocaleString("ja-JP")} ${review.currency}`,
      `登録後: ${next.toLocaleString("ja-JP")} ${review.currency}`,
      "",
      "登録後はこの候補のイベント、確認状態、解析下書きを変更できません。"
    ].join("\n"));
    if(!confirmed) { message("経費登録を中止しました。候補の下書きは変更していません。"); return; }
    busy = true; update(); message("確認した1件を経費台帳へ登録しています…");
    try {
      const data = await callable("gmailExpensePostReviewedCandidate", {
        candidateId,
        confirmation: "post_reviewed_expense",
        expectedCurrentAmount: current
      });
      item.expensePosted = true;
      item.expensePost = data.expensePost;
      if(data.categoryEntry) session.expenses[review.category] = data.categoryEntry;
      render();
      message(data.duplicate ? "この候補はすでに経費登録済みです。重複登録はしていません。" : `${amount.toLocaleString("ja-JP")} ${review.currency}を${session.eventName}の${label}へ登録しました。`);
    } catch(e) { message(`経費台帳へ登録できませんでした: ${e.message || e}`, true); }
    finally { busy = false; update(); }
  }
  results.addEventListener("click", event => {
    const article = event.target.closest(".item[data-id]");
    const evidenceButton = event.target.closest("button[data-evidence]");
    if(evidenceButton && article) { inspectEvidence(article.dataset.id); return; }
    const saveEvidenceButton = event.target.closest("button[data-save-evidence]");
    if(saveEvidenceButton && article) { saveEvidenceReview(article.dataset.id, article); return; }
    const postExpenseButton = event.target.closest("button[data-post-expense]");
    if(postExpenseButton && article) { postExpense(article.dataset.id); return; }
    const button = event.target.closest("button[data-status]");
    if(button && article) review(article.dataset.id, button.dataset.status);
  });
  results.addEventListener("change", event => {
    const select = event.target.closest("select[data-scope]");
    const article = event.target.closest(".item[data-id]");
    if(select && article) assignEvent(article.dataset.id, select.value);
  });
  eventFilter.addEventListener("change", render);
  load.addEventListener("click", loadCandidates);
  login.addEventListener("click", async () => { try { await loginWithGoogle(); } catch(e) { message(`ログインできませんでした: ${e.message || e}`, true); } });
  try {
    await initFirebase(); const { app, enabled } = getFirebaseState();
    if(!enabled || !app) throw new Error("Firebaseを初期化できませんでした。");
    functions = getFunctions(app, "asia-southeast1");
    await initAuth((user, error) => {
      signedIn = Boolean(user);
      staff.textContent = user ? `ログイン中: ${user.email}` : "Sales Managerへのログインが必要です。";
      login.hidden = Boolean(user); update();
      if(error) message(error.message || "操作が許可されていません。", true);
    });
  } catch(e) { message(e.message || String(e), true); }
</script>
</body>
